  @"
server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/users/**
        - id: trip-service
          uri: http://trip-service:8082
          predicates:
            - Path=/trips/**
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/notifications/**
"